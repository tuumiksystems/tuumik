services:
  app:
    image: tuumik/tuumik:1.1.7
    depends_on:
      - mongo
    restart: unless-stopped
    environment:
      ROOT_URL: https://tuumik.example.com
      MONGO_URL: mongodb://mongo:27017/meteor
      MONGO_OPLOG_URL: mongodb://mongo:27017/local
      PORT: 3000
      TZ: Etc/UTC
      USER_API_KEY_EXPIRY_DAYS: 90
      OAUTH_ACCESS_TOKEN_EXPIRY_MINUTES: 60
      OAUTH_REFRESH_TOKEN_EXPIRY_DAYS: 90
      DEMO_MAX_AGE_HOURS: 24
      DEMO_PERIOD_DAYS: 36
      DEMO_TIMEZONES: "single"
      DEMO_RESET_PASSWORD: ""
      METEOR_SETTINGS: |
        {
          "public": {
            "email": false,
            "demoMode": true,
            "timesheetExplorerLimit": 3000,
            "maxTeamSize": 50,
            "mcpServerUrl": "https://tuumik.example.com/mcp"
          },
          "private": {
            "systemEmail": "noreply@exampledomain.com",
            "monitorEmail": "monitor@exampledomain.com"
          }
        }

  mongo:
    image: mongo:7.0.16
    command: [--replSet, rs0, --port, "27017"]
    restart: unless-stopped
    volumes:
      - tuumikdb:/data/db

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - mcp

  export:
    image: tuumik/tuumik-export:1.0.1
    restart: unless-stopped
    environment:
      API_KEY: tuumik

  mcp:
    image: tuumik/tuumik-mcp:1.0.6
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_URL: http://app:3000
      # browser-reachable URLs advertised in OAuth metadata:
      # PUBLIC_APP_URL must match the app's ROOT_URL; the MCP server shares
      # the app's domain (Caddy routes /mcp and the OAuth well-known paths here)
      PUBLIC_APP_URL: https://tuumik.example.com
      PUBLIC_MCP_URL: https://tuumik.example.com

volumes:
  tuumikdb:
  caddy_data:
  caddy_config:
