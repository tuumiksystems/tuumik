services:
  app:
    image: tuumik/tuumik:1.1.10
    ports:
      - '3000:3000'
    depends_on:
      - mongo
    restart: unless-stopped
    environment:
      ROOT_URL: http://localhost:3000
      MONGO_URL: mongodb://mongo:27017/meteor
      MONGO_OPLOG_URL: mongodb://mongo:27017/local
      PORT: 3000
      TZ: Etc/UTC
      USER_API_KEY_EXPIRY_DAYS: 90
      OAUTH_ACCESS_TOKEN_EXPIRY_MINUTES: 60
      OAUTH_REFRESH_TOKEN_EXPIRY_DAYS: 90
      DEMO_MAX_AGE_HOURS: 24
      DEMO_PERIOD_DAYS: 36
      DEMO_TIMEZONES: "single"
      DEMO_RESET_PASSWORD: ""
      METEOR_SETTINGS: |
        {
          "public": {
            "email": false,
            "demoMode": true,
            "timesheetExplorerLimit": 3000,
            "maxTeamSize": 50,
            "mcpServerUrl": "http://localhost:3100/mcp"
          },
          "private": {
            "systemEmail": "noreply@exampledomain.com",
            "monitorEmail": "monitor@exampledomain.com"
          }
        }

  mongo:
    image: mongo:7.0.16
    command: [--replSet, rs0, --port, "27017"]
    restart: unless-stopped
    volumes:
      - tuumikdb:/data/db

  export:
    image: tuumik/tuumik-export:1.0.3
    restart: unless-stopped
    environment:
      API_KEY: tuumik
      # The XLSX1_* and PDF1_* variables are explained in /docs/export-appearance.md
      XLSX1_HEADER: "&C&KBFBFBFtuumik.com"
      XLSX1_FOOTER: "&C&P"
      # XLSX1_LOGO: /assets/logo.png
      # XLSX1_LOGO_WIDTH: 50
      # XLSX1_LOGO_HEIGHT: 50
      # PDF1_LOGO: /assets/logo.png
      # PDF1_LOGO_WIDTH: 20
      # PDF1_LOGO_HEIGHT: 20
      # PDF1_HEADER_LEFT_TEXT: "Acme LLC"
      # PDF1_HEADER_LEFT_COLOR: "#000000"
      PDF1_HEADER_RIGHT_TEXT: "tuumik.com"
      PDF1_HEADER_RIGHT_COLOR: "#b9b9b9"
    volumes:
      - ./assets:/assets:ro

  mcp:
    image: tuumik/tuumik-mcp:1.0.6
    ports:
      - '3100:3000'
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_URL: http://app:3000
      # browser-reachable URLs advertised in OAuth metadata:
      # PUBLIC_APP_URL must match the app's ROOT_URL, PUBLIC_MCP_URL is where
      # MCP clients reach this container from outside
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_MCP_URL: http://localhost:3100

volumes:
  tuumikdb:
